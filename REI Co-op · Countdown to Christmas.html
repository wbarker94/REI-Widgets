<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REI Co-op · Countdown to Christmas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700;800&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#10241C;      /* spruce night sky */
    --pine:#2B5640;       /* forest ridge */
    --ridge:#1A3529;      /* far ridge */
    --snow:#FFFFFF;
    --frost:#CFE1E6;      /* muted text */
    --ember:#D2232A;      /* holiday red */
    --lantern:#F0B64A;    /* warm gold */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:transparent}
  body{font-family:"Work Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--snow)}

  .widget{
    container-type:inline-size;
    position:relative;
    width:100%;
    min-width:220px;
    max-width:900px;
    margin:0 auto;
    overflow:hidden;
    border-radius:14px;
    background:
      radial-gradient(120% 80% at 80% 0%, #1E4034 0%, transparent 60%),
      linear-gradient(180deg, var(--night) 0%, #16302A 100%);
    isolation:isolate;
  }
  canvas.snow{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}

  .inner{position:relative;z-index:2;padding:clamp(14px,4cqi,32px) clamp(14px,4.5cqi,36px) 0}

  /* Header */
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .badge{background:var(--snow);border-radius:8px;padding:clamp(4px,1cqi,8px) clamp(6px,1.4cqi,10px);display:inline-flex;line-height:0}
  .logo{height:clamp(26px,6cqi,42px);width:auto;display:block}
  .greet{font-family:"Bitter",Georgia,serif;font-weight:500;font-size:clamp(12px,2.2cqi,16px);color:var(--frost);text-align:right;line-height:1.3}

  h1{
    font-family:"Bitter",Georgia,serif;font-weight:800;
    font-size:clamp(20px,5.4cqi,40px);line-height:1.1;letter-spacing:-.01em;
    margin-top:clamp(12px,3cqi,22px);
  }
  .sub{color:var(--frost);font-size:clamp(12px,2cqi,15px);margin-top:4px}

  /* Countdown */
  .clock{
    display:grid;grid-template-columns:repeat(4,1fr);
    gap:clamp(6px,1.6cqi,14px);
    margin-top:clamp(14px,3.4cqi,26px);
  }
  .unit{
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12);
    border-radius:10px;
    padding:clamp(8px,2cqi,16px) 4px clamp(6px,1.4cqi,12px);
    text-align:center;
  }
  .unit.days{background:var(--ember);border-color:var(--ember)}
  .num{
    font-family:"Bitter",Georgia,serif;font-weight:700;
    font-size:clamp(26px,9cqi,72px);line-height:1;
    font-variant-numeric:tabular-nums;
  }
  .lbl{font-size:clamp(11px,1.8cqi,14px);color:var(--frost);margin-top:4px}
  .unit.days .lbl{color:#FFE3E3}

  /* Trail to the summit */
  .trail{position:relative;margin-top:clamp(16px,3.6cqi,28px)}
  .trail svg{display:block;width:100%;height:auto}
  .trail-meta{
    display:flex;justify-content:space-between;align-items:baseline;gap:8px;
    font-size:clamp(11px,1.8cqi,14px);color:var(--frost);
    background:var(--pine);
    padding:clamp(6px,1.4cqi,10px) clamp(14px,4.5cqi,36px) clamp(10px,2cqi,16px);
    margin-top:-1px;
  }
  .trail-meta strong{color:var(--lantern);font-weight:600}

  /* Christmas Day state */
  .merry{display:none;text-align:center;padding:clamp(10px,3cqi,20px) 0}
  .merry .big{font-family:"Bitter",Georgia,serif;font-weight:800;font-size:clamp(28px,8cqi,64px);color:var(--lantern);line-height:1.05}
  .merry p{color:var(--frost);margin-top:6px;font-size:clamp(12px,2.2cqi,16px)}
  .widget.is-christmas .clock{display:none}
  .widget.is-christmas .merry{display:block}

  /* Narrow widths: 2 x 2 grid, stacked header */
  @container (max-width:380px){
    .clock{grid-template-columns:repeat(3,1fr)}
    .unit.days{grid-column:1 / -1}
    .num{font-size:28px}
    .unit.days .num{font-size:52px}
    .greet{display:none}
    .trail-meta{flex-direction:column;align-items:flex-start;gap:0}
  }
  @media (prefers-reduced-motion:reduce){ canvas.snow{display:none} .hiker{transition:none} }
</style>
</head>

    <h1 id="xmas-title">Countdown to Christmas</h1>
    <p class="sub" id="sub">Until December 25</p>

    <div class="clock" role="timer" aria-live="off">
      <div class="unit days"><div class="num" id="d">--</div><div class="lbl">days</div></div>
      <div class="unit"><div class="num" id="h">--</div><div class="lbl">hours</div></div>
      <div class="unit"><div class="num" id="m">--</div><div class="lbl">minutes</div></div>
      <div class="unit"><div class="num" id="s">--</div><div class="lbl">seconds</div></div>
    </div>

    <div class="merry">
      <div class="big">Merry Christmas</div>
      <p>Thanks for all you do this season. Now go enjoy some time outside.</p>
    </div>
  </div>

  <!-- Ridgeline: the season is a climb, Christmas is the summit -->
  <div class="trail" aria-hidden="true">
    <svg viewBox="0 0 900 170" preserveAspectRatio="none">
      <path fill="var(--ridge)" d="M0 110 L90 70 L150 95 L240 40 L320 85 L410 55 L500 92 L600 48 L690 80 L780 60 L900 90 L900 170 L0 170Z"/>
      <path id="ridge" fill="var(--pine)" d="M0 150 L120 128 L210 136 L330 104 L420 116 L540 80 L620 92 L740 46 L800 58 L860 30 L900 44 L900 170 L0 170Z"/>
      <!-- snowcap on summit -->
      <path fill="var(--snow)" opacity=".9" d="M845 38 L860 30 L878 39 L868 42 L860 37 L852 43Z"/>
      <!-- trees -->
      <g fill="#0F2219">
        <path d="M60 152 l10 -26 l10 26z"/><path d="M78 152 l8 -20 l8 20z"/>
        <path d="M250 140 l11 -28 l11 28z"/><path d="M270 138 l8 -20 l8 20z"/>
        <path d="M470 118 l10 -26 l10 26z"/><path d="M660 98 l9 -24 l9 24z"/>
      </g>
      <!-- trail line (invisible guide) -->
      <path id="path" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2" stroke-dasharray="2 7"
        d="M20 146 L120 128 L210 136 L330 104 L420 116 L540 80 L620 92 L740 46 L800 58 L860 30"/>
      <!-- summit star -->
      <g transform="translate(860 18)">
        <path fill="var(--lantern)" d="M0 -12 L3.5 -3.7 L12 -3.7 L5.2 1.6 L7.6 10 L0 5 L-7.6 10 L-5.2 1.6 L-12 -3.7 L-3.5 -3.7Z"/>
      </g>
      <!-- hiker marker -->
      <g class="hiker" id="hiker">
        <circle r="9" fill="var(--ember)" stroke="var(--snow)" stroke-width="3"/>
      </g>
    </svg>
    <div class="trail-meta">
      <span>Trail to the summit</span>
      <span id="pct"><strong>0%</strong> of the way there</span>
    </div>
  </div>
</section>

<script>
(function(){
  const root = document.getElementById('xmas');
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2,'0');

  // The "season" climb starts Oct 1 and summits Dec 25 (local time).
  function targets(now){
    let y = now.getFullYear();
    const xmasStart = new Date(y, 11, 25);
    const xmasEnd   = new Date(y, 11, 26);
    if (now >= xmasEnd) y += 1;
    return {
      target: new Date(y, 11, 25),
      start:  new Date(y, 9, 1),
      isChristmas: now >= xmasStart && now < xmasEnd
    };
  }

  const path = $('path'), hiker = $('hiker');
  const len = path.getTotalLength();

  function tick(){
    const now = new Date();
    const t = targets(now);
    root.classList.toggle('is-christmas', t.isChristmas);

    if (t.isChristmas){
      placeHiker(1); $('pct').innerHTML = '<strong>Summit reached</strong>';
      $('sub').textContent = 'It’s December 25';
      return;
    }

    let diff = Math.max(0, t.target - now);
    const d = Math.floor(diff / 864e5); diff -= d * 864e5;
    const h = Math.floor(diff / 36e5);  diff -= h * 36e5;
    const m = Math.floor(diff / 6e4);   diff -= m * 6e4;
    const s = Math.floor(diff / 1e3);

    $('d').textContent = d;
    $('h').textContent = pad(h);
    $('m').textContent = pad(m);
    $('s').textContent = pad(s);
    root.querySelector('.unit.days .lbl').textContent = d === 1 ? 'day' : 'days';
    $('sub').textContent = 'Until December 25, ' + t.target.getFullYear();

    const p = Math.min(1, Math.max(0, (now - t.start) / (t.target - t.start)));
    placeHiker(p);
    $('pct').innerHTML = now < t.start
      ? 'The climb starts October 1'
      : '<strong>' + Math.round(p*100) + '%</strong> of the way there';
  }

  function placeHiker(p){
    const pt = path.getPointAtLength(len * p);
    hiker.setAttribute('transform', 'translate(' + pt.x + ' ' + (pt.y - 4) + ')');
  }

  tick();
  setInterval(tick, 1000);

  // Gentle snowfall
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cv = root.querySelector('canvas.snow');
  if (reduce || !cv.getContext) return;
  const ctx = cv.getContext('2d');
  let W, H, flakes = [];
  function size(){
    const r = root.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    const count = Math.round(W / 9);
    flakes = Array.from({length: count}, () => ({
      x: Math.random()*W, y: Math.random()*H,
      r: Math.random()*1.8 + .6, v: Math.random()*.5 + .25, drift: Math.random()*.6 - .3,
      o: Math.random()*.5 + .35
    }));
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    for (const f of flakes){
      f.y += f.v; f.x += f.drift;
      if (f.y > H) { f.y = -4; f.x = Math.random()*W; }
      if (f.x > W) f.x = 0; if (f.x < 0) f.x = W;
      ctx.globalAlpha = f.o; ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI*2); ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  new ResizeObserver(size).observe(root);
  size(); draw();
})();
</script>
</body>
</html>
